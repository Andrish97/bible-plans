name: Testy

on:
  push:
  pull_request:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: W repozytorium nie ma tekstu przekładów
        run: |
          ! git ls-files | grep -E '\.mybible$|^data/translations/[^/]+/text/|^\.cache/'
      - name: Kompletność planów (każdy werset dokładnie raz)
        run: node tools/check.mjs
      - name: Lista plików offline w service workerze
        run: node tools/check_sw.mjs
