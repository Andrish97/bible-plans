<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generator planu czytania Biblii</title>
<style>
:root{--bg:#f5f2ec;--card:#fff;--ink:#1f1d1a;--muted:#6f6a62;--accent:#7a2e1d;--accent2:#b5532f;--line:#e3dccf;--warn:#9a3412;--warnbg:#fff1e6;--chip:#f3ebe0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171613;--card:#23211c;--ink:#ece8df;--muted:#a9a196;--accent:#e6a382;--accent2:#f0b99c;--line:#3a362f;--warn:#ffb38a;--warnbg:#3a2a20;--chip:#2e2a24}}
:root[data-theme="dark"]{--bg:#171613;--card:#23211c;--ink:#ece8df;--muted:#a9a196;--accent:#e6a382;--accent2:#f0b99c;--line:#3a362f;--warn:#ffb38a;--warnbg:#3a2a20;--chip:#2e2a24}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:16px 22px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;color:var(--accent);font-family:Georgia,"Times New Roman",serif}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:360px 1fr;gap:18px;padding:18px;max-width:1280px;margin:0 auto;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
aside.panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:900px){aside.panel{position:static;max-height:none}}
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:600;color:var(--accent);margin-bottom:8px;padding:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
select,input[type=number],input[type=date]{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
select option:disabled{color:var(--muted)}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days label{display:flex;flex-direction:column;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:7px;padding:7px 0;cursor:pointer;background:var(--bg)}
.days input{margin:0 0 3px}
.reading{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--bg)}
.reading .rhead{display:grid;grid-template-columns:82px 1fr;gap:8px;align-items:center;font-weight:600;color:var(--accent);font-size:13px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:6px;margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;margin:2px}
.tag .x{background:none;color:var(--muted);padding:0 0 0 2px;border:0;font-size:14px;line-height:1;cursor:pointer;width:auto}
.tag .x:hover{color:var(--warn)}
.warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn);border-radius:9px;padding:9px 11px;margin-bottom:12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.set-head{display:flex;justify-content:flex-end;margin-bottom:8px}
.round{width:36px;height:36px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
#fname{width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
button{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.preview-head h2{font-size:16px;margin:0;color:var(--accent);font-family:Georgia,"Times New Roman",serif}
.stats{color:var(--muted);font-size:12px}
.title-print{display:none}
.sub-print{display:none}
.table-wrap{max-height:74vh;overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{position:sticky;top:0;background:var(--card);font-weight:600;color:var(--accent);font-size:12px;z-index:1}
td.date{white-space:nowrap;color:var(--muted);width:130px;font-size:12px}
td.txt{white-space:pre-line}
tr.off td{color:var(--muted)}
tr:nth-child(even) td{background:rgba(0,0,0,.02)}
/* własne pola wyboru i listy rozwijane w kolorach motywu */
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:16px;height:16px;flex:none;margin:0 7px 0 0;vertical-align:-3px;border:1.5px solid var(--muted);border-radius:4px;background:var(--bg);display:inline-grid;place-content:center;cursor:pointer;transition:background .12s,border-color .12s}
input[type=checkbox]::before{content:"";width:8px;height:8px;transform:scale(0);transition:transform .12s;background:#fff;clip-path:polygon(14% 44%,0 65%,50% 100%,100% 16%,80% 0%,43% 62%)}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::before{transform:scale(1)}
input[type=checkbox]:hover{border-color:var(--accent)}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
input[type=checkbox]:disabled{opacity:.4;cursor:not-allowed}
label:has(input[type=checkbox]){display:flex;align-items:center;cursor:pointer}
.days label:has(input[type=checkbox]){flex-direction:column}
select{appearance:none;-webkit-appearance:none;-moz-appearance:none;padding-right:30px;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(-45deg,transparent 50%,var(--accent) 50%);background-size:6px 6px;background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-repeat:no-repeat;transition:border-color .12s,box-shadow .12s}
select:hover{border-color:var(--accent2)}
select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
select option{background:var(--card);color:var(--ink)}
/* własna lista wyboru zamiast natywnej */
select.native{display:none!important}
.dd{position:relative;width:100%}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.dd-btn:hover{border-color:var(--accent2)}
.dd-btn:focus-visible,.dd.open .dd-btn{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.dd-btn .car{width:7px;height:7px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s;flex:none}
.dd.open .dd-btn .car{transform:rotate(225deg) translate(-2px,-2px)}
.dd-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 24px rgba(0,0,0,.16);max-height:260px;overflow:auto}
.dd-list[hidden]{display:none}
.cal-pop.fx,.dd-list.fx{position:fixed}
.reading{background:none;border:0;box-shadow:none;padding:0 0 2px;margin:0 0 8px}
.dd-list li{padding:7px 9px;border-radius:6px;cursor:pointer;color:var(--ink);white-space:normal}
.dd-list li:hover,.dd-list li.act{background:var(--chip)}
.dd-list li[aria-selected="true"]{color:var(--accent);font-weight:600}
.dd-list li.dis{color:var(--muted);opacity:.5;cursor:not-allowed;background:none}
/* własny kalendarz daty startu: ikona w środku pola, całość wygląda jak zwykłe pole */
.cal{position:relative}
.cal-field{position:relative}
#start{width:100%;padding:8px 38px 8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
#start:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.cal-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--accent);cursor:pointer;display:grid;place-items:center}
.cal-btn:hover{background:var(--chip)}
.cal-btn:focus-visible{outline:none;box-shadow:0 0 0 2px var(--accent2)}
.cal-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:40;width:272px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;box-shadow:0 10px 24px rgba(0,0,0,.16)}
.cal-pop[hidden]{display:none}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-title{font-weight:600;color:var(--accent);font-size:13px}
.cal-nav{width:30px;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--accent);cursor:pointer;font:inherit;padding:0}
.cal-nav:hover{border-color:var(--accent2)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{font-size:11px;color:var(--muted);text-align:center;padding:2px 0}
.cal-day{height:32px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;padding:0}
.cal-day:hover{background:var(--chip)}
.cal-day.blank{visibility:hidden}
.cal-day.today{box-shadow:inset 0 0 0 1px var(--accent2)}
.cal-day.sel{background:var(--accent);color:#fff}
.cal-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.cal-foot button{background:transparent;color:var(--accent);border:0;font:inherit;font-size:13px;cursor:pointer;padding:4px 6px;border-radius:6px}
.cal-foot button:hover{background:var(--chip)}
/* dni tygodnia: jedna karta, zaznaczenie kolorem karty (bez osobnego pudełka) */
.days label{position:relative;padding:8px 0;justify-content:center;transition:background .12s,color .12s,border-color .12s}
.days label:hover{border-color:var(--accent2)}
.days label:has(input:checked){background:var(--accent);border-color:var(--accent);color:#fff}
.days label:has(input:focus-visible){box-shadow:0 0 0 2px var(--accent2)}
.days input[type=checkbox]{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
/* zwarte ustawienia: cały panel mieści się na ekranie komputera bez przewijania */
@media (min-width:901px){
  header{padding:7px 22px}
  header h1{font-size:16px}
  header p{font-size:11.5px}
  .layout{grid-template-columns:430px 1fr;padding:8px 18px;gap:16px}
  aside.panel{padding:7px 14px;max-height:calc(100vh - 52px)}
  fieldset{margin:0 0 8px}
  legend{margin-bottom:4px}
  .hint{margin:2px 0 0;font-size:11px;line-height:1.3}
  select,input[type=number],input[type=text],#start,.dd-btn{padding:6px 9px}
  .reading{padding:4px 8px;margin-bottom:4px}
  .reading select,.reading .dd-btn{padding:5px 9px}
  .reading .rhead{font-size:12.5px}
  .days label{padding:4px 0}
  .addrow{margin-top:4px}
  .reading .rhead > span{line-height:1.15}
  .two{gap:8px}
}
.reading .rhead > span{display:flex;flex-direction:column;line-height:1.25}
.reading .rhead .cnt{font-weight:400;color:var(--muted);font-size:11px}
@media (min-width:901px){
  .reading .rhead > span{font-size:12.5px}
  .days label{padding:4px 0}
}
/* motyw: przełącznik w nagłówku */
.hdr-row{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.theme-sw{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--bg);flex:none}
.theme-sw button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:4px 11px;border-radius:999px;cursor:pointer}
.theme-sw button[aria-checked="true"]{background:var(--accent);color:#fff}
.theme-sw button:focus-visible{outline:2px solid var(--accent2);outline-offset:1px}
/* widok telefonu: ustawienia i podgląd na osobnych ekranach */
.view-btn,.back-btn{display:none}
/* lista wyboru pokazuje się tylko po otwarciu */
.dd-list{display:none}
.dd.open .dd-list{display:block}
@media (max-width:900px){
  .view-btn{display:block;width:100%;margin-top:6px;padding:11px 14px;font-size:14px}
  .back-btn{display:inline-block;margin-bottom:10px;background:transparent;color:var(--accent);border:1px solid var(--accent);padding:6px 12px;font-size:13px}
  body:not(.show-preview) #previewPanel{display:none}
  body.show-preview aside.panel{display:none}
  .reading .rhead{grid-template-columns:1fr;gap:6px}
}
/* czytania: nazwa i liczba ksiąg w jednej linii, lista pod spodem na pełną szerokość */
.reading .rhead{grid-template-columns:1fr;gap:2px}
.reading .rhead > span{display:flex;flex-direction:row;align-items:baseline;gap:8px;flex-wrap:wrap}
.reading .rhead .cnt{font-size:11px}
.dd-btn .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* nagłówek w jednej linii na komputerze */
@media (min-width:901px){
  header{padding:5px 18px}
  .hdr-row{flex-wrap:nowrap;gap:12px}
  .hdr-row > div:first-child{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:nowrap}
  header h1{font-size:15px;white-space:nowrap}
  header p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;min-width:0}
  .theme-sw button{padding:3px 10px;font-size:11.5px}
}
/* komputer: strona bez przewijania, przewija się tylko podgląd */
@media (min-width:901px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column}
  .layout{flex:1 1 0;min-height:0;height:0;max-width:none;align-items:stretch;padding-bottom:12px}
  aside.panel{position:static;max-height:none;height:100%;min-height:0;overflow:auto}
  section.panel{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  section.panel .table-wrap{flex:1 1 0;min-height:0;max-height:none}
}
@media (min-width:901px) and (max-height:820px){ aside.panel .hint{line-height:1.2;margin:2px 0} aside.panel .reading{padding:2px 8px;margin-bottom:2px} aside.panel fieldset{margin-bottom:4px} aside.panel legend{margin-bottom:2px} aside.panel label{margin:2px 0;line-height:1.3} aside.panel .dd-btn,aside.panel select{padding:4px 9px} aside.panel .days label{padding:4px 0} }
.even{white-space:nowrap;width:150px}
.even .bar{display:inline-block;width:72px;height:6px;background:var(--line);border-radius:3px;vertical-align:middle;margin-right:7px;overflow:hidden}
.even .bar i{display:block;height:100%;background:var(--accent)}
.even b{font-size:12px;font-weight:600;color:var(--muted)}
.print-grid{display:none}
@media (min-width:901px) and (max-height:740px){ aside.panel{font-size:13px} aside.panel .hint{font-size:10.5px;margin:1px 0} aside.panel .dd-btn,aside.panel select{padding:3px 8px} aside.panel fieldset{margin-bottom:3px} aside.panel legend{font-size:11px} aside.panel .reading{padding:1px 8px;margin-bottom:1px} aside.panel .reading .rhead{font-size:12px} }
.qb{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;padding:0;margin-left:4px;border-radius:50%;border:1px solid var(--line);background:var(--chip);color:var(--accent);font:600 11px/1 system-ui,sans-serif;cursor:pointer;vertical-align:middle;text-transform:none;letter-spacing:0}
.qb:hover,.qb[aria-expanded="true"]{border-color:var(--accent)}
.help-pop{position:fixed;z-index:60;width:280px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 10px 24px rgba(0,0,0,.2);font-size:12.5px;line-height:1.45;color:var(--ink);text-transform:none;font-weight:400;letter-spacing:0}
.help-pop[hidden]{display:none}
@media print{
  @page{size:A4 portrait;margin:10mm}
  .even{display:none!important}
  .table-wrap{display:none!important}
  .print-grid{display:block!important}
  .print-grid table{width:100%;border-collapse:collapse;font-size:7.5pt;line-height:1.15}
  .print-grid th,.print-grid td{padding:0.6px 3px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
  .print-grid th{border-bottom:2px solid #7a2e1d;color:#7a2e1d;font-size:7.5pt;background:#fff;position:static}
  .print-grid td.date{white-space:nowrap;color:#333;width:1%}
  .print-grid .sep{border-left:2px solid #7a2e1d;padding-left:6px}
  .print-page{break-after:page}
  .print-page:last-child{break-after:auto}
  .back-btn,.view-btn,#toPreview,#toSettings,.preview-head .btns,.preview-head p{display:none!important}
  .preview-head{padding:0!important;margin:0!important}
  section.panel{padding:0!important;margin:0!important}
  #printTitle,#printSub{display:none!important}
  .print-grid caption{caption-side:top;text-align:center;padding:0 0 3mm}
  .print-grid .cap-t{display:block;font-family:Georgia,serif;font-size:13pt;color:#7a2e1d}
  .print-grid .cap-s{display:block;font-family:Georgia,serif;font-size:8pt;color:#555;margin-top:1mm}
  .sub-print{display:block;font-family:Georgia,serif;font-size:11pt;color:#555;margin:0 0 6mm;text-align:center}
  .title-print,.sub-print{padding:0!important;text-align:center!important;width:100%!important}
  td.date{font-size:8.5pt;color:#333;width:1%}
  .title-print{text-align:center;font-size:22pt;margin:0 0 2mm}
  table{font-size:8.5pt;line-height:1.15}
  th,td{padding:0.6px 4px!important}
  .title-print{font-size:12pt;margin:0 0 0!important}
  .sub-print{font-size:8pt;margin:0 0 2mm!important}
  th{border-bottom:2px solid #7a2e1d;font-size:8.5pt}
  tr:nth-child(even) td{background:#faf6f1!important}
  td.date{white-space:nowrap}
  td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;color:#000;font-size:10.5pt}
  header,aside,.preview-head .stats,.btns,.warn{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  .panel{border:0;padding:0}
  .table-wrap{max-height:none;overflow:visible;border:0}
  th{position:static;background:#fff;color:#7a2e1d}
  th,td{border-bottom:1px solid #bbb;padding:4px 6px}
  tr{break-inside:avoid}
  thead{display:table-header-group}
  .title-print{display:block;font-family:Georgia,serif;font-size:18pt;color:#7a2e1d;margin:0 0 4mm}
  .preview-head h2{display:none}
  html,body{height:auto!important;overflow:visible!important}
  body{display:block!important}
  .layout{height:auto!important;flex:none!important;display:block!important}
  section.panel{height:auto!important;min-height:0!important;overflow:visible!important;display:block!important}
  section.panel .table-wrap{flex:none!important;max-height:none!important;overflow:visible!important}
}
</style>
</head>
<body>
<div class="help-pop" id="helpPop" role="dialog" hidden></div>
<header>
  <div class="hdr-row">
    <div>
      <h1>Generator planu czytania Biblii</h1>
      <p>Wybierz, ile czytań dziennie i co zawiera każde z nich. Podgląd pobierzesz jako CSV albo PDF.</p>
    </div>
    <div class="theme-sw" role="radiogroup" aria-label="Motyw">
      <button type="button" role="radio" data-theme-val="auto" aria-checked="true">Auto</button>
      <button type="button" role="radio" data-theme-val="light" aria-checked="false">Jasny</button>
      <button type="button" role="radio" data-theme-val="dark" aria-checked="false">Ciemny</button>
    </div>
  </div>
</header>

<div class="layout">
<aside class="panel">
  <div class="warn" id="warn" hidden></div>
  <div class="set-head"><button type="button" class="ghost" id="reset">Resetuj ustawienia</button></div>

  <fieldset>
    <legend>Gotowe ustawienia</legend>
    <select id="preset">
      <option value="" selected>—</option>
      <option value="p3_5">3 czytania · 5 dni</option>
      <option value="p3_7">3 czytania · 7 dni</option>
      <option value="p2_5">2 czytania · 5 dni</option>
      <option value="p2_7">2 czytania · 7 dni</option>
      <option value="allc_5">Cała Biblia chronologicznie · 5 dni</option>
      <option value="allc_7">Cała Biblia chronologicznie · 7 dni</option>
      <option value="alls_5">Cała Biblia po kolei · 5 dni</option>
      <option value="alls_7">Cała Biblia po kolei · 7 dni</option>
    </select>
  </fieldset>
  <fieldset>
    <legend>Czytania dziennie <button type="button" class="qb" data-h="czytania" aria-label="Wyjaśnienie" aria-expanded="false">?</button></legend>
    <select id="nread">
      <option value="1">1</option>

function range(a,b){ const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; }
const ALL = range(1,66);
const SETS = { all: ALL, ot: range(1,39), otnw: range(1,39).filter(b => b<18 || b>22), wis: range(18,22), nt: range(40,66) };
const LABEL = { all:"Cała Biblia", ot:"Stary Testament zwykły", otnw:"Stary Testament bez mądrościowych", wis:"Mądrościowe (Hiob na końcu)", nt:"Nowy Testament", own:"Własny" };

// Reading state: how many readings, what each one is, and which books it contains
let N = 3;
const CONT = ["otnw","wis","nt","ot"];
const READ = [new Set(SETS.otnw), new Set(SETS.wis), new Set(SETS.nt), new Set(SETS.ot)];
let last = null;
let blocked = false;

function dirty(){ last = null; refresh(); generate(); }
function setContent(i, key){
  CONT[i] = key;
  READ[i] = new Set(key === 'own' ? [] : SETS[key]);
  dirty();
}

function activeParts(){
  const out = [];
  for(let i=0;i<N;i++){
    const books = ALL.filter(b => READ[i].has(b));
    const name = CONT[i] === 'own' ? `Własny ${i+1}` : LABEL[CONT[i]];
    out.push({p: i+1, name, books});
  }
  return out;
}

// Chronology: one reading (whole Bible, Old or New Testament), or two readings: Old + New Testament.
function chronAllowed(){
  const ps = activeParts();
  if(ps.some(p => !p.books.length)) return false;
  const eq = (a,b) => a.length === b.length && a.every((x,i) => x === b[i]);
  if(ps.length === 1) return eq(ps[0].books, ALL) || eq(ps[0].books, SETS.ot) || eq(ps[0].books, SETS.nt);
  if(ps.length === 2){
    const x = ps[0].books, y = ps[1].books;
    return (eq(x,SETS.ot) && eq(y,SETS.nt)) || (eq(x,SETS.nt) && eq(y,SETS.ot));
  }
  return false;
}

function problems(){
  const msgs = [];
  if(activeParts().some(p => !p.books.length)) msgs.push("Każde czytanie musi mieć przynajmniej jedną księgę.");
  if(![...document.querySelectorAll('#days input')].some(x => x.checked)) msgs.push("Zaznacz przynajmniej jeden dzień tygodnia.");
  const n = parseInt($('ndays').value,10);
  if(!(n >= 1 && n <= 800)) msgs.push("Liczba dni musi być od 1 do 800.");
  if(!$('start').value) msgs.push("Podaj datę startu.");
  return msgs;
}

function renderReadings(){
  const host = $('readings'); host.innerHTML = "";
  for(let i=0;i<N;i++){
    const box = document.createElement('div'); box.className = 'reading';
    const head = document.createElement('div'); head.className = 'rhead';
    const lab = document.createElement('span'); lab.textContent = `Czytanie ${i+1}`;
    const sel = document.createElement('select');
    for(const [k,v] of [["all","Cała Biblia"],["otnw","Stary Testament bez mądrościowych"],["wis","Mądrościowe (Hiob na końcu)"],["nt","Nowy Testament"],["ot","Stary Testament zwykły"],["own","Własny (wybór ksiąg)"]]){
      const o = document.createElement('option'); o.value = k; o.textContent = v; sel.appendChild(o);
    }
    sel.value = CONT[i];
    sel.addEventListener('change', () => setContent(i, sel.value));
    head.appendChild(lab); head.appendChild(sel); box.appendChild(head);

    if(CONT[i] === 'own'){
      const addrow = document.createElement('div'); addrow.className = 'addrow';
      const bsel = document.createElement('select');
      for(const [title,from,to] of SECTIONS){
        const og = document.createElement('optgroup'); og.label = title;
        for(let b=from;b<=to;b++){
          const o = document.createElement('option'); o.value = b; o.textContent = PL_NAMES[b-1]; og.appendChild(o);
        }
        bsel.appendChild(og);
      }
      const btn = document.createElement('button'); btn.className = 'ghost'; btn.textContent = 'Dodaj';
      btn.addEventListener('click', () => { READ[i].add(+bsel.value); dirty(); });
      addrow.appendChild(bsel); addrow.appendChild(btn); box.appendChild(addrow);
      const tags = document.createElement('div'); tags.className = 'tags';
      for(const b of ALL){
        if(!READ[i].has(b)) continue;
        const t = document.createElement('span'); t.className = 'tag';
        t.appendChild(document.createTextNode(PL_NAMES[b-1]));
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '×';
        x.setAttribute('aria-label', 'Usuń ' + PL_NAMES[b-1]);
        x.addEventListener('click', () => { READ[i].delete(b); dirty(); });
        t.appendChild(x); tags.appendChild(t);
      }
      box.appendChild(tags);
      const cnt = document.createElement('p'); cnt.className = 'hint';
      cnt.textContent = READ[i].size ? `${READ[i].size} ksiąg` : 'Dodaj co najmniej jedną księgę.';
      box.appendChild(cnt);
    } else {
      const cnt = document.createElement('small'); cnt.className = 'cnt';
      cnt.textContent = `${READ[i].size} ksiąg`;
      lab.appendChild(cnt);
    }
    host.appendChild(box);
  }
}

function refresh(){
  { const hx = UNIT() === 'chapters'; $('useHeads').disabled = hx; $('useHeadsWrap').style.opacity = hx ? '0.4' : '1'; $('noSplitCh').disabled = hx; $('noSplitWrap').style.opacity = hx ? '0.4' : '1'; }
  const ok = chronAllowed();
  $('order').querySelector('option[value=chron]').disabled = !ok;
  if(!ok && ORDER() === 'chron') $('order').value = 'seq';
  $('order-hint').textContent = ok ? "" : "Chronologia: jedno czytanie (cała Biblia, Stary albo Nowy Testament) albo dwa: Stary i Nowy Testament.";
  renderReadings();
  const msgs = problems();
  const w = $('warn');
  w.textContent = msgs.join(" ");
  w.hidden = msgs.length === 0;
  blocked = msgs.length > 0;
  $('dl').disabled = msgs.length > 0;
  $('pdf').disabled = msgs.length > 0;
}

// ---- units and weights ------------------------------------------------
function explodeUnit(u, mode){
  if(mode === 'chapters') return [u];
  const out = [];
  for(let v=u[2]; v<=u[3]; v++) out.push([u[0],u[1],v,v]);
  return out;
}
function unitWeight(u, mode){
  if(mode === 'words'){ let s=0; for(let v=u[2]; v<=u[3]; v++) s += VW(u[0],u[1],v); return s; }
  if(mode === 'verses') return u[3]-u[2]+1;
  return 1;
}
// Each group: {u: [units], link: id or null}. Units from one chronological entry (pasaż) share a link id; cuts inside it are penalised.
function buildGroups(books, chron, mode){
  const set = new Set(books);
  const groups = [];
  if(chron){
    let linkId = 0;
    for(const segs of ENTRY_SEGS){
      linkId++;
      const parts = segs.map(seg => seg.filter(p => set.has(p[0]))).filter(x => x.length);
      if(parts.length > 1){
        // linked passages: each unit is a group tagged with the entry; cuts inside an entry are penalised
        for(const seg of parts) for(const p of seg) for(const e of explodeUnit(p, mode)) groups.push({u:[e], link: linkId});
      } else if(parts.length === 1){
        for(const p of parts[0]) for(const e of explodeUnit(p, mode)) groups.push({u:[e], link: linkId});  // cięcie wewnątrz pasażu kosztuje, między pasażami nie
      }
    }
  } else {
    let order = books.slice().sort((a,b) => a-b);
    if(set.has(18)){                                                  // Hiob goes after the last wisdom book in this reading
      let lastW = 0;
      for(const b of order) if(b >= 19 && b <= 22) lastW = b;
      if(lastW){ order = order.filter(b => b !== 18); order.splice(order.indexOf(lastW)+1, 0, 18); }
    }
    for(const b of order){
      const bk = BOOKS[b-1];
      for(let c=1; c<=bk.ch.length; c++)
        for(const e of explodeUnit([b,c,1,bk.ch[c-1]], mode)) groups.push({u:[e], link: null});
    }
  }
  return groups;
}
function splitGroups(groups, K, mode, useHeads, noSplitCh, softMix){
  const days = Array.from({length:K}, () => []);
  const G = groups.length;
  if(K === 0 || G === 0) return days;
  if(G < K){ groups.forEach((g,i) => { days[Math.floor(i*K/G)].push(...g.u); }); return days; }
  const cum = []; let t = 0;
  for(const g of groups){ t += g.u.reduce((s,u) => s + unitWeight(u,mode), 0); cum.push(t); }
  const total = t || 1;
  const PEN = 0.25 * total / K;                       // cutting inside a linked entry costs a quarter of a day
  const headCut = e => e < G && isHeadStart(groups[e]);
  // kolejność ważności: 1) nagłówki (pełny dzień kary), 2) nie mieszaj ksiąg (pół dnia), 3) równomierność dni
  const HEADS_PEN = total / K;                        // cutting away from a heading costs one day
  const CH_PEN = 0.6 * total / K;                     // cutting inside a chapter costs 0.3 day (when 'nie dziel rozdziałów')
  const NOMIX_PEN = 0.5 * total / K;                  // miękki: cięcie w środku księgi kosztuje pół dnia
  const sameBookCut = e => e < G && groups[e-1].u[groups[e-1].u.length-1][0] === groups[e].u[0][0];
  const chapCut = e => e < G && groups[e-1].u[groups[e-1].u.length-1].slice(0,2).join() === groups[e].u[0].slice(0,2).join();
  const cumAt = e => cum[e-1];                        // weight of groups[0..e-1]
  // a cut after e groups falls inside an entry if groups[e-1] and groups[e] share a link
  const inside = e => e < G && groups[e-1].link !== null && groups[e-1].link === groups[e].link;
  const ends = []; let prev = 0;
  for(let k=1; k<K; k++){
    const target = total * k / K;
    const lo = prev + 1, hi = G - (K - k);
    let best = lo, bestCost = Infinity;
    for(let e=lo; e<=hi; e++){
      const cost = Math.abs(cumAt(e) - target) + (inside(e) ? PEN : 0) + (useHeads && !headCut(e) ? HEADS_PEN : 0) + (noSplitCh && chapCut(e) ? CH_PEN : 0) + (softMix && sameBookCut(e) ? NOMIX_PEN : 0);
      if(cost < bestCost){ bestCost = cost; best = e; }
    }
    ends.push(best); prev = best;
  }
  ends.push(G);
  let s = 0;
  for(let k=0; k<K; k++){
    for(let i=s; i<ends[k]; i++) days[k].push(...groups[i].u);
    s = ends[k];
  }
  return days;
}

// nie łącz ksiąg (twardy): dzień to albo fragment jednej księgi, albo same całe księgi (małe księgi można łączyć)
function splitBookSafe(groups, K, mode, useHeads, noSplitCh){
  const segs = [];
  for(const g of groups){
    const bk = g.u[0][0];
    const last = segs[segs.length-1];
    if(last && last.bk === bk) last.groups.push(g); else segs.push({bk, groups:[g]});
  }
  segs.forEach(s => { s.w = s.groups.reduce((a,g) => a + g.u.reduce((x,u) => x + unitWeight(u,mode), 0), 0); s.n = s.groups.length; });
  const total = segs.reduce((a,s) => a + s.w, 0) || 1;
  const target = total / K;
  // bloki: duża księga (więcej niż dzień) to osobny blok; kolejne małe księgi tworzą wspólny blok
  const blocks = [];
  for(const s of segs){
    if(s.w > target) blocks.push({big:true, segs:[s], w:s.w, n:s.n});
    else {
      const last = blocks[blocks.length-1];
      if(last && !last.big) { last.segs.push(s); last.w += s.w; last.n += 1; }
      else blocks.push({big:false, segs:[s], w:s.w, n:1});
    }
  }
  if(blocks.length > K) return null;
  // dni na blok: proporcjonalnie do wagi, min 1, max liczba jednostek podziału (dla małych bloków: liczba ksiąg)
  blocks.forEach(bl => { bl.d = Math.max(1, Math.min(bl.n, Math.round(bl.w / target))); });
  let sum = blocks.reduce((a,bl) => a + bl.d, 0);
  while(sum < K){
    const cand = blocks.filter(bl => bl.d < bl.n);
    if(!cand.length) return null;
    cand.sort((x,y) => (y.w/y.d) - (x.w/x.d))[0].d++; sum++;
  }
  while(sum > K){
    const cand = blocks.filter(bl => bl.d > 1);
    if(!cand.length) return null;
    cand.sort((x,y) => (x.w/x.d) - (y.w/y.d))[0].d--; sum--;
  }
  const days = [];
  for(const bl of blocks){
    if(bl.big){
      days.push(...splitGroups(bl.segs[0].groups, bl.d, mode, useHeads, noSplitCh, false));
    } else {
      const pseudo = bl.segs.map(s => ({u: s.groups.flatMap(g => g.u), link: null}));
      days.push(...splitGroups(pseudo, bl.d, mode, false, false, false));
    }
  }
  return days;
}

// ---- rendering ------------------------------------------------------------
function render(run){
  const [bk,c1,v1,c2,v2] = run;
  const fs = v1===1, fe = v2===LAST(bk,c2);
  let s;
  if(c1===c2){ s = (fs && fe) ? `${c1}` : (v1===v2 ? `${c1}:${v1}` : `${c1}:${v1}-${v2}`); }
  else if(fs && fe){ s = `${c1}-${c2}`; }
  else { s = `${c1}:${v1}-${c2}:${v2}`; }
  return `${ABBR(bk)} ${s}`;
}
function bookText(list){
  // jedna księga w danym dniu -> lista tekstów (zakresy)
  const bk = list[0][0];
  const runs = [];
  for(const [, ch, vs, ve] of list){
    if(runs.length){
      const r = runs[runs.length-1];
      const [, pc1, pv1, pc2, pv2] = r;
      if((pc2===ch && vs<=pv2+1) || (pc2+1===ch && vs===1 && pv2===LAST(bk,pc2))){
        runs[runs.length-1] = [bk, pc1, pv1, Math.max(pc2,ch), pc2===ch ? Math.max(pv2,ve) : ve];
        continue;
      }
    }
    runs.push([bk, ch, vs, ch, ve]);
  }
  const parts = runs.map(render);
  const out = [];
  let cur = parts[0], chunk = [];
  const flush = () => { out.push(chunk.length ? cur + ", " + chunk.join(", ") : cur); chunk = []; };
  for(let k=1;k<parts.length;k++){
    const p = parts[k];
    if(p.includes(":") || cur.includes(":")){ flush(); cur = p; }
    else chunk.push(p.slice(ABBR(bk).length+1));
  }
  flush();
  return out;
}
function dayText(units, noMerge){
  let groups = [];
  if(noMerge){
    // tylko kolejne fragmenty tej samej księgi, kolejność jak w planie
    for(const u of units){
      const g = groups[groups.length-1];
      if(g && g[0][0]===u[0]) g.push(u); else groups.push([u]);
    }
  } else {
    // w jednym dniu wszystkie fragmenty tej samej księgi łączymy
    const order = [], byBook = new Map();
    for(const u of units){
      if(!byBook.has(u[0])){ byBook.set(u[0], []); order.push(u[0]); }
      byBook.get(u[0]).push(u);
    }
    groups = order.map(bk => byBook.get(bk).slice().sort((x,y) => x[1]-y[1] || x[2]-y[2]));
  }
  return groups.flatMap(bookText).join("; ");
}

// ---- plan ----------------------------------------------------------------
function buildPlan(){
  const chron = ORDER() === 'chron';
  const mode = UNIT();
  const sep = $('sep').value.replace(/\\n/g, "\n");
  const [sy,sm,sd] = $('start').value.split('-').map(Number);
  const n = Math.max(1, Math.min(800, parseInt($('ndays').value,10) || 365));
  const wd = new Set([...document.querySelectorAll('#days input')].filter(x=>x.checked).map(x=>+x.value));
  const dates = [], slots = [];
  for(let i=0;i<n;i++){
    const d = new Date(sy, sm-1, sd+i);
    dates.push(d);
    if(wd.has((d.getDay()+6)%7)) slots.push(i);
  }
  const K = slots.length;
  const parts = activeParts();
  const useHeads = $('useHeads').checked && UNIT() !== 'chapters';
  const mixMode = chron ? 'off' : $('noMixMode').value;
  const noSplitCh = UNIT() !== 'chapters' && $('noSplitCh').checked;
  const perPart = parts.map(pt => {
    const groups = buildGroups(pt.books, chron, mode);
    return (mixMode === 'hard' && splitBookSafe(groups, K, mode, useHeads, noSplitCh)) || splitGroups(groups, K, mode, useHeads, noSplitCh, mixMode === 'soft');
  });
  const cells = Array.from({length:n}, () => "");
  const rowParts = Array.from({length:n}, () => parts.map(() => ""));
  const rowLoads = Array.from({length:n}, () => null);
  for(let j=0;j<K;j++){
    const texts = perPart.map(days => days[j].length ? dayText(days[j]) : "");
    if(texts.some(Boolean)){
      rowParts[slots[j]] = texts;
      rowLoads[slots[j]] = perPart.map(days => days[j].reduce((a,u) => a + u[3] - u[2] + 1, 0));
      cells[slots[j]] = texts.filter(Boolean).join(sep);
    }
  }
  const info = parts.map((pt,i) => ({name: pt.name, verses: perPart[i].reduce((s,d)=>s+d.reduce((a,u)=>a+u[3]-u[2]+1,0),0)}));
  return {dates, parts, rowParts, rowLoads, rows: cells, info};
}

<script>
// Własne listy wyboru: ukryty <select> zostaje źródłem prawdy (ten sam id i zdarzenie change)
(function(){
  const protoDesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype,'value');
  const wrappers = [];
  function build(sel){
    sel.classList.add('native'); sel.hidden = true; sel.style.display = 'none';
    const wrap = document.createElement('div');
    wrap.className = 'dd';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'dd-btn'; btn.setAttribute('aria-haspopup','listbox'); btn.setAttribute('aria-expanded','false');
    const lbl = document.createElement('span'); lbl.className = 'lbl';
    const car = document.createElement('span'); car.className = 'car';
    btn.append(lbl, car);
    const list = document.createElement('ul');
    list.className = 'dd-list'; list.setAttribute('role','listbox'); list.hidden = true; list.style.display = 'none';
    wrap.append(btn, list);
    sel.parentNode.insertBefore(wrap, sel);
    const st = {sel, wrap, btn, lbl, list, act: -1};
    wrappers.push(st);
    const sync = () => {
      const o = sel.options[sel.selectedIndex];
      lbl.textContent = o ? o.textContent : '';
      [...list.children].forEach((li,i) => {
        const opt = sel.options[i];
        li.setAttribute('aria-selected', String(i === sel.selectedIndex));
        li.classList.toggle('dis', !!(opt && opt.disabled));
        li.setAttribute('aria-disabled', String(!!(opt && opt.disabled)));
      });
    };
    st.sync = sync;
    const rebuild = () => {
      list.innerHTML = '';
      [...sel.options].forEach((opt,i) => {
        const li = document.createElement('li');
        li.setAttribute('role','option'); li.dataset.i = i; li.textContent = opt.textContent;
        list.appendChild(li);
      });
      sync();
    };
    st.rebuild = rebuild;
    rebuild();
    // wartość ustawiana z kodu także odświeża widok
    Object.defineProperty(sel,'value',{configurable:true,
      get(){ return protoDesc.get.call(this); },
      set(v){ protoDesc.set.call(this,v); sync(); }});
    const onScrollClose = e => { if (!list.contains(e.target)) close(); };
    const close = () => { wrap.classList.remove('open'); list.hidden = true; list.style.display = 'none'; btn.setAttribute('aria-expanded','false'); window.removeEventListener('scroll', onScrollClose, true); window.removeEventListener('resize', close); };
    const open = () => {
      wrappers.forEach(w => { if (w !== st) w.close(); });
      rebuild();
      wrap.classList.add('open'); list.hidden = false; list.style.display = 'block'; btn.setAttribute('aria-expanded','true');
      st.act = sel.selectedIndex; highlight();
      placeFixed(list, btn);
      window.addEventListener('scroll', onScrollClose, true); window.addEventListener('resize', close);
    };
    const highlight = () => [...list.children].forEach((li,i) => li.classList.toggle('act', i === st.act));
    const choose = (i) => {
      const opt = sel.options[i];
      if (!opt || opt.disabled) return;
      protoDesc.set.call(sel, opt.value);
      sync();
      sel.dispatchEvent(new Event('change',{bubbles:true}));
      close(); btn.focus();
    };
    st.close = close;
    btn.addEventListener('click', () => list.hidden ? open() : close());
    list.addEventListener('click', e => { const li = e.target.closest('li'); if (li) choose(+li.dataset.i); });
    btn.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); if (list.hidden) open();
        const n = sel.options.length; let i = st.act;
        do { i = (i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; } while (sel.options[i].disabled && i !== st.act);
        st.act = i; highlight();
      } else if (e.key === 'Enter' || e.key === ' ') {
        if (!list.hidden && st.act >= 0) { e.preventDefault(); choose(st.act); }
      } else if (e.key === 'Escape') { close(); }
    });
    list.addEventListener('mousemove', e => { const li = e.target.closest('li'); if (li) { st.act = +li.dataset.i; highlight(); } });
    sel.dataset.ready = '1';
  }
  // wszystkie listy, także tworzone dynamicznie (np. "Czytanie 1–3"), dostają własny widok
  const scan = () => document.querySelectorAll('select:not([data-ready])').forEach(build);
  scan();
  new MutationObserver(() => scan()).observe(document.body, {childList:true, subtree:true});
  document.addEventListener('click', e => { wrappers.forEach(w => { if (!w.wrap.contains(e.target)) w.close(); }); });
})();
</script>
<script>
// Własny kalendarz wyboru daty startu (wartość nadal w polu #start jako RRRR-MM-DD)
(function(){
  const inp = document.getElementById('start'), btn = document.getElementById('calBtn'), pop = document.getElementById('calPop');
  if(!inp || !btn || !pop) return;
  const MONTHS = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
  const DOW = ['Pn','Wt','Śr','Cz','Pt','So','Nd'];
  const pad = n => String(n).padStart(2,'0');
  const fmt = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
  const parse = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((s||'').trim()); if(!m) return null; const y=+m[1], mo=+m[2]-1, d=+m[3]; const dt=new Date(y,mo,d); return dt.getFullYear()===y && dt.getMonth()===mo && dt.getDate()===d ? {y,m:mo,d} : null; };
  let view = parse(inp.value) || (() => { const t=new Date(); return {y:t.getFullYear(), m:t.getMonth(), d:t.getDate()}; })();
  const today = () => { const t=new Date(); return {y:t.getFullYear(), m:t.getMonth(), d:t.getDate()}; };
  function render(){
    const sel = parse(inp.value), t = today();
    const first = new Date(view.y, view.m, 1);
    const lead = (first.getDay()+6)%7;
    const days = new Date(view.y, view.m+1, 0).getDate();
    let html = `<div class="cal-head"><button type="button" class="cal-nav" data-nav="-1" aria-label="Poprzedni miesiąc">‹</button><span class="cal-title">${MONTHS[view.m]} ${view.y}</span><button type="button" class="cal-nav" data-nav="1" aria-label="Następny miesiąc">›</button></div><div class="cal-grid">`;
    html += DOW.map(x => `<div class="cal-dow">${x}</div>`).join('');
    for(let i=0;i<lead;i++) html += `<span class="cal-day blank"></span>`;
    for(let d=1; d<=days; d++){
      const cls = ['cal-day'];
      if(sel && sel.y===view.y && sel.m===view.m && sel.d===d) cls.push('sel');
      if(t.y===view.y && t.m===view.m && t.d===d) cls.push('today');
      html += `<button type="button" class="${cls.join(' ')}" data-d="${d}">${d}</button>`;
    }
    html += `</div><div class="cal-foot"><button type="button" data-today="1">Dziś</button><button type="button" data-close="1">Zamknij</button></div>`;
    pop.innerHTML = html;
  }
  function open(){ view = parse(inp.value) || view; render(); pop.hidden = false; btn.setAttribute('aria-expanded','true'); placeFixed(pop, inp.parentElement, 272); }
  function close(){ pop.hidden = true; btn.setAttribute('aria-expanded','false'); }
  window.addEventListener('scroll', e => { if (!pop.hidden && !pop.contains(e.target)) close(); }, true);
  window.addEventListener('resize', () => { if (!pop.hidden) placeFixed(pop, inp.parentElement, 272); });
  function setDate(y,m,d){
    inp.value = fmt(y,m,d);
    view = {y,m,d};
    inp.dispatchEvent(new Event('input',{bubbles:true}));
    inp.dispatchEvent(new Event('change',{bubbles:true}));
  }
  btn.addEventListener('click', e => { e.stopPropagation(); pop.hidden ? open() : close(); });
  pop.addEventListener('click', e => {
    e.stopPropagation();
    const nav = e.target.closest('[data-nav]');
    if(nav){ const dm = +nav.dataset.nav; let m = view.m + dm, y = view.y; if(m<0){m=11;y--;} if(m>11){m=0;y++;} view = {y, m, d:1}; render(); return; }
    const day = e.target.closest('[data-d]');
    if(day){ setDate(view.y, view.m, +day.dataset.d); close(); btn.focus(); return; }
    if(e.target.closest('[data-today]')){ const t=today(); setDate(t.y,t.m,t.d); close(); btn.focus(); return; }
    if(e.target.closest('[data-close]')){ close(); btn.focus(); }
  });
  inp.addEventListener('input', () => { const p = parse(inp.value); if(p) view = p; if(!pop.hidden) render(); });
  inp.addEventListener('keydown', e => { if(e.key==='ArrowDown'){ e.preventDefault(); open(); } if(e.key==='Escape') close(); });
  document.addEventListener('click', e => { if(!pop.hidden && !e.target.closest('.cal')) close(); });
  document.addEventListener('keydown', e => { if(e.key==='Escape') close(); });
})();
</script>
<script>
// Motyw: auto (wg systemu), jasny albo ciemny; zapamiętywany w przeglądarce
(function(){
  const KEY='plan-motyw';
  const root=document.documentElement;
  const btns=[...document.querySelectorAll('[data-theme-val]')];
  function apply(v){
    if(v==='light'||v==='dark') root.setAttribute('data-theme',v); else root.removeAttribute('data-theme');
    btns.forEach(b=>b.setAttribute('aria-checked', String(b.dataset.themeVal===v)));
  }
  let saved='auto'; try{ saved=localStorage.getItem(KEY)||'auto'; }catch(e){}
  apply(saved);
  btns.forEach(b=>b.addEventListener('click',()=>{ apply(b.dataset.themeVal); try{ localStorage.setItem(KEY,b.dataset.themeVal); }catch(e){} }));
})();
// Telefon: podgląd jako osobny ekran (#podglad), przycisk Wstecz wraca do ustawień
(function(){
  const toP=document.getElementById('toPreview'), toS=document.getElementById('toSettings');
  const route=()=>{ document.body.classList.toggle('show-preview', location.hash==='#podglad'); window.scrollTo(0,0); };
  toP.addEventListener('click',()=>{ location.hash='podglad'; });
  toS.addEventListener('click',()=>{ if(location.hash==='#podglad') history.back(); else location.hash=''; });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
